<?xml version="1.0" encoding="UTF-8"?>
<svg width="320" height="120" viewBox="0 0 320 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景装饰 -->
  <rect x="0" y="0" width="320" height="120" fill="#f8fafc"/>
  
  <!-- 医疗十字图标 -->
  <g transform="translate(30, 60)">
    <circle cx="0" cy="0" r="25" fill="url(#blueGradient)" opacity="0.1"/>
    <!-- 垂直条 -->
    <rect x="-2.5" y="-15" width="5" height="30" fill="url(#blueGradient)" rx="2.5"/>
    <!-- 水平条 -->
    <rect x="-15" y="-2.5" width="30" height="5" fill="url(#blueGradient)" rx="2.5"/>
    <!-- 中心点 -->
    <circle cx="0" cy="0" r="3" fill="url(#redGradient)"/>
  </g>
  
  <!-- STRICT 主标题 -->
  <text x="70" y="45" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="url(#blueGradient)">STRICT</text>
  
  <!-- 注册商标符号 -->
  <text x="200" y="35" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="url(#redGradient)">®</text>
  
  <!-- 副标题 -->
  <text x="70" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748b">Medical Supply</text>
  
  <!-- 装饰线 -->
  <line x1="70" y1="80" x2="250" y2="80" stroke="url(#blueGradient)" stroke-width="2" opacity="0.3"/>
  
  <!-- 公司名称 -->
  <text x="70" y="100" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#94a3b8">NanTong Strip Medical Supply Co.,Ltd.</text>
  
  <!-- 装饰元素 -->
  <circle cx="280" cy="30" r="3" fill="url(#redGradient)" opacity="0.6"/>
  <circle cx="290" cy="40" r="2" fill="url(#blueGradient)" opacity="0.4"/>
  <circle cx="285" cy="50" r="1.5" fill="url(#redGradient)" opacity="0.5"/>
</svg>
